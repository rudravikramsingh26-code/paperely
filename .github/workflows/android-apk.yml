name: Build Paperly Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build installable APK
        run: |
          gradle -p android --no-daemon assembleDebug
          cp android/app/build/outputs/apk/debug/app-debug.apk Paperly.apk

      - name: Upload installable APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Paperly-Android-APK
          path: Paperly.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: paperly-android-${{ github.run_number }}
          name: Paperly Android v2.0.0 (build ${{ github.run_number }})
          body: |
            Paperly for Android.

            A focused PDF viewer, image-to-PDF creator and image compressor.
            Compress images at low, medium or high quality, convert JPG/JPEG, PNG and WebP formats, and save batches as a ZIP.
            Images and documents are processed locally on your device. No API tokens required.
          files: Paperly.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
